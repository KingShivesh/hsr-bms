name: Keep Render backend awake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-alive.yml"
  schedule:
    # UTC: 10:57 AM through 2:07 AM IST, around the approved 11 AM-2 AM shift.
    # Offset from the top of the hour to reduce peak-load delays.
    - cron: "27,37,47,57 5 * * *"
    - cron: "7,17,27,37,47,57 6-19 * * *"
    - cron: "7,17,27,37 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            https://hsr-bms-backend.onrender.com/health
