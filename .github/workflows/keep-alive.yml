name: Keep Render backend awake

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions peak-load delays.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            https://hsr-bms-backend.onrender.com/health
