name: Secret history guard

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install checksum-verified official scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 "$base/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive"
      - name: Scan all available history with redacted output
        env:
          GITLEAKS_PATH: ${{ runner.temp }}/gitleaks/gitleaks
        run: node frontend/scripts/scan-secrets-history.mjs "$RUNNER_TEMP/secrets-history.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redacted-secret-locations
          path: ${{ runner.temp }}/secrets-history.json
          if-no-files-found: ignore
